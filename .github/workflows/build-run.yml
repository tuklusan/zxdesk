name: Build and run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: zxdesk-main
  cancel-in-progress: false

jobs:
  build-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libboost-all-dev libspectrum-dev libaudiofile-dev libgtk-3-dev libxml2-dev libbz2-dev libgcrypt20-dev libpng-dev libsamplerate0-dev libzstd-dev libcurl4-openssl-dev libgl-dev libglew-dev xvfb scrot wget
          wget -q https://pasmo.speccy.org/bin/pasmo-0.5.5.tar.gz
          tar xzf pasmo-0.5.5.tar.gz
          cd pasmo-0.5.5
          ./configure
          make -j2
          sudo make install
          cd ..
          sudo apt-get install -y fuse-emulator-gtk

      - name: Build
        shell: zsh {0}
        run: |
          set -eu
          mkdir -p build shots
          ./build.sh
          test -s build/zxdesk.tap

      - name: Run and capture
        run: |
          set -eu
          Xvfb :99 -screen 0 1024x768x24 >build/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2
          fuse --machine 48 --no-sound build/zxdesk.tap >build/fuse.log 2>&1 &
          FUSE_PID=$!
          sleep 12
          scrot shots/zxdesk.png
          test -s shots/zxdesk.png
          kill "$FUSE_PID" 2>/dev/null || true

      - name: Save outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zxdesk-run
          path: |
            build/zxdesk.tap
            build/zxdesk.bin
            build/zxdesk.sym
            build/fuse.log
            build/xvfb.log
            shots/zxdesk.png
          if-no-files-found: warn

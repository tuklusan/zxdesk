name: Build and run

on:
  push:
    branches: [main]
    paths:
      - scratch/run-request.txt

permissions:
  contents: read

concurrency:
  group: zxdesk-main
  cancel-in-progress: false

jobs:
  build-run:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Record runner
        run: |
          mkdir -p build shots scratch
          printf '%s\n' "$RUNNER_NAME" > scratch/current-runner-name.txt
          printf '%s\n' "$RUNNER_OS" > scratch/current-runner-os.txt
          printf '%s\n' "$RUNNER_ARCH" > scratch/current-runner-arch.txt
          printf '%s\n' "$GITHUB_RUN_ID" > scratch/current-run-id.txt

      - name: Verify ROM
        run: |
          set -eu
          test -s assets/48.rom
          printf '%s  %s\n' d55daa439b673b0e3f5897f99ac37ecb45f974d1862b4dadb85dec34af99cb42 assets/48.rom | sha256sum -c -

      - name: Install pinned tools
        run: |
          set -eu
          source build/tools/toolchain.env
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates wget             "fuse-emulator-common=$FUSE_PACKAGE_VERSION"             "fuse-emulator-gtk=$FUSE_PACKAGE_VERSION"             "xvfb=$XVFB_PACKAGE_VERSION"             "scrot=$SCROT_PACKAGE_VERSION"
          wget -q -O "pasmo-$PASMO_VERSION.tar.gz" "$PASMO_URL"
          printf '%s  %s\n' "$PASMO_SHA256" "pasmo-$PASMO_VERSION.tar.gz" | sha256sum -c -
          tar xzf "pasmo-$PASMO_VERSION.tar.gz"
          cd "pasmo-$PASMO_VERSION"
          ./configure
          make -j1
          sudo make install
          command -v pasmo
          fuse --version

      - name: Build
        run: |
          set -eu
          pasmo -I src --name zxdesk.tap --tapbas src/zxdesk.asm build/zxdesk.tap build/zxdesk.sym
          pasmo -I src --bin src/zxdesk.asm build/zxdesk.bin
          test -s build/zxdesk.tap
          test -s build/zxdesk.bin
          bytes=$(stat -c%s build/zxdesk.bin)
          end=$((0x6000 + bytes))
          slowend=$(awk '$1=="SlowEnd"{v=$3; sub(/[Hh]$/,"",v); print v; exit}' build/zxdesk.sym)
          slowend=$((16#${slowend:-6000}))
          test "$end" -le $((0xBD00))
          test "$slowend" -le $((0x8000))

      - name: Run and capture
        run: |
          set -eu
          Xvfb :99 -screen 0 1024x768x24 -ac >build/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2
          fuse --machine 48 --rom-48 assets/48.rom --auto-load --accelerate-loader --no-sound build/zxdesk.tap >build/fuse.log 2>&1 &
          FUSE_PID=$!
          trap 'kill "$FUSE_PID" "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 12
          scrot shots/zxdesk.png
          test -s shots/zxdesk.png

      - name: Save outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zxdesk-run
          path: |
            build/zxdesk.tap
            build/zxdesk.bin
            build/zxdesk.sym
            build/fuse.log
            build/xvfb.log
            scratch/current-runner-name.txt
            scratch/current-runner-os.txt
            scratch/current-runner-arch.txt
            scratch/current-run-id.txt
            shots/zxdesk.png
          if-no-files-found: warn

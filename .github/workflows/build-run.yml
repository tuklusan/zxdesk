name: Build and run

on:
  push:
    branches: [main]
    paths:
      - scratch/run-request.txt

permissions:
  contents: read

concurrency:
  group: zxdesk-main
  cancel-in-progress: false

jobs:
  build-run:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu@sha256:2e863c44b718727c860746568e1d54afd13b2fa71b160f5cd9058fc436217b30
    timeout-minutes: 15
    steps:
      - name: Bootstrap checkout
        run: |
          set -eu
          printf 'APT::Snapshot "%s";\n' 20260630T120000Z > /etc/apt/apt.conf.d/50zxdesk-snapshot
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Record runner
        run: |
          mkdir -p build shots scratch
          printf '%s\n' "$RUNNER_NAME" > scratch/current-runner-name.txt
          printf '%s\n' "$RUNNER_OS" > scratch/current-runner-os.txt
          printf '%s\n' "$RUNNER_ARCH" > scratch/current-runner-arch.txt
          printf '%s\n' "$GITHUB_RUN_ID" > scratch/current-run-id.txt
          printf '%s\n' "${ImageVersion:-unknown}" > scratch/current-host-image-version.txt
          printf '%s\n' 'ubuntu@sha256:2e863c44b718727c860746568e1d54afd13b2fa71b160f5cd9058fc436217b30' > scratch/current-execution-image.txt
          printf '%s\n' '20260630T120000Z' > scratch/current-package-snapshot.txt

      - name: Verify ROM
        run: |
          set -eu
          test -s assets/48.rom
          printf '%s  %s\n' d55daa439b673b0e3f5897f99ac37ecb45f974d1862b4dadb85dec34af99cb42 assets/48.rom | sha256sum -c -

      - name: Install pinned tools
        run: bash build/tools/install-pinned.sh

      - name: Build
        run: |
          set -eu
          pasmo -I src --name zxdesk.tap --tapbas src/zxdesk.asm build/zxdesk.tap build/zxdesk.sym
          pasmo -I src --bin src/zxdesk.asm build/zxdesk.bin
          test -s build/zxdesk.tap
          test -s build/zxdesk.bin
          bytes=$(stat -c%s build/zxdesk.bin)
          end=$((0x6000 + bytes))
          slowend=$(awk '$1=="SlowEnd"{v=$3; sub(/[Hh]$/,"",v); print v; exit}' build/zxdesk.sym)
          slowend=$((16#${slowend:-6000}))
          test "$end" -le $((0xBD00))
          test "$slowend" -le $((0x8000))

      - name: Run and capture
        run: |
          set -eu
          Xvfb :99 -screen 0 1024x768x24 -ac >build/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2
          fuse --machine 48 --rom-48 assets/48.rom --auto-load --accelerate-loader --no-sound build/zxdesk.tap >build/fuse.log 2>&1 &
          FUSE_PID=$!
          trap 'kill "$FUSE_PID" "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 12
          scrot shots/zxdesk.png
          test -s shots/zxdesk.png

      - name: Save outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zxdesk-run
          path: |
            build/zxdesk.tap
            build/zxdesk.bin
            build/zxdesk.sym
            build/fuse.log
            build/xvfb.log
            scratch/current-runner-name.txt
            scratch/current-runner-os.txt
            scratch/current-runner-arch.txt
            scratch/current-run-id.txt
            scratch/current-host-image-version.txt
            scratch/current-execution-image.txt
            scratch/current-package-snapshot.txt
            shots/zxdesk.png
          if-no-files-found: warn

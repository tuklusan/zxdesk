name: GUI acceptance capture

on:
  push:
    paths:
      - '.run/gui-capture'

permissions:
  contents: write

concurrency:
  group: zxdesk-gui-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu@sha256:2e863c44b718727c860746568e1d54afd13b2fa71b160f5cd9058fc436217b30
    timeout-minutes: 20
    steps:
      - name: Bootstrap checkout
        run: |
          set -eu
          printf 'APT::Snapshot "%s";\n' 20260630T120000Z > /etc/apt/apt.conf.d/50zxdesk-snapshot
          apt-get -o Acquire::https::Verify-Peer=false update
          apt-get -o Acquire::https::Verify-Peer=false install -y --no-install-recommends ca-certificates
          apt-get update
          apt-get install -y --no-install-recommends git git-lfs

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main

      - name: Verify ROM
        run: |
          set -eu
          test -s assets/48.rom
          printf '%s  %s\n' d55daa439b673b0e3f5897f99ac37ecb45f974d1862b4dadb85dec34af99cb42 assets/48.rom | sha256sum -c -

      - name: Install pinned tools
        run: bash build/tools/install-pinned.sh

      - name: Run acceptance
        run: bash build/tools/test-product.sh

      - name: Commit captures
        run: |
          set -eu
          git rev-parse --is-inside-work-tree
          mkdir -p images/gui_acceptance_test
          rm -f images/gui_acceptance_test/*.png
          cp shots/gui-*.png images/gui_acceptance_test/
          test "$(find images/gui_acceptance_test -maxdepth 1 -name 'gui-*.png' -type f | wc -l)" -eq 11
          git config --local filter.lfs.clean 'git-lfs clean -- %f'
          git config --local filter.lfs.smudge 'git-lfs smudge -- %f'
          git config --local filter.lfs.process 'git-lfs filter-process'
          git config --local filter.lfs.required true
          git add images/gui_acceptance_test
          git rm .github/workflows/gui-capture.yml
          names="$(git diff --cached --name-only)"
          printf '%s\n' "$names" | grep -qx '.github/workflows/gui-capture.yml'
          test "$(printf '%s\n' "$names" | grep -c '^images/gui_acceptance_test/gui-.*\.png$')" -eq 11
          test "$(printf '%s\n' "$names" | wc -l)" -eq 12
          for f in images/gui_acceptance_test/*.png; do
            git show ":$f" | grep -qx 'version https://git-lfs.github.com/spec/v1'
            git show ":$f" | grep -Eq '^oid sha256:[0-9a-f]{64}$'
            git show ":$f" | grep -Eq '^size [0-9]+$'
          done
          git config user.name tuklusan
          git config user.email tuklusan@users.noreply.github.com
          git commit -m 'Store GUI acceptance captures'
          git lfs push origin HEAD
          git push origin HEAD:main
